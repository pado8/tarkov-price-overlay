<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var I = D.items;
  var KEY = "guide.keys", MODEKEY = "guide.mode";
  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function won(n) { return n == null ? null : Math.round(n).toLocaleString("ko-KR") + " ₽"; }
  var have = load(KEY, {}), mode = load(MODEKEY, "pvp");
  var cur = (location.hash || "").replace("#", "") || "all";

  var mapsEl = document.getElementById("maps");
  var btns = [{ id: "all", n: "전체" }].concat(D.maps.map(function (m) { return { id: m.id, n: m.n }; }));
  mapsEl.innerHTML = btns.map(function (b) { return "<button data-v=\"" + esc(b.id) + "\">" + esc(b.n) + "</button>"; }).join("");
  function setSeg(id, v) { document.querySelectorAll("#" + id + " button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-v") === v); }); }
  setSeg("maps", cur); setSeg("mode", mode);

  function price(it) { var p = mode === "pve" ? it.pve : it.pvp; return p == null ? null : p; }
  function row(k) {
    var it = I[k.id]; if (!it) return "";
    var done = !!have[k.id];
    var p = price(it);
    var badges = (k.q.length ? "<span class=\"badge b-quest\">퀘스트 " + k.q.length + "</span> " : "") +
      (k.power ? "<span class=\"badge b-power\">전원 필요</span> " : "") +
      (k.lt.indexOf("container") >= 0 ? "<span class=\"badge b-any\">보관함</span> " : "") +
      (k.lt.indexOf("car") >= 0 ? "<span class=\"badge b-any\">차량</span> " : "");
    return "<label class=\"krow" + (done ? " done" : "") + "\" data-id=\"" + esc(k.id) + "\">" +
      "<input type=\"checkbox\" aria-label=\"보유\"" + (done ? " checked" : "") + " />" +
      "<img class=\"icon\" loading=\"lazy\" alt=\"\" src=\"" + esc(it.img) + "\" />" +
      "<div><div class=\"nm\">" + esc(it.n) + "</div><div class=\"en\">" + esc(it.en) + "</div>" +
      "<div style=\"margin-top:3px\">" + badges + "<span class=\"small muted\">여는 곳 " + k.locks + "곳" + (it.uses ? " · 사용 " + it.uses + "회" : "") + "</span></div>" +
      (k.q.length ? "<div class=\"qlist\">" + k.q.map(esc).join(" · ") + "</div>" : "") + "</div>" +
      "<div class=\"right\">" + (p != null ? "<div class=\"price\">플리 " + won(p) + "</div>" : "<div class=\"small muted\">플리 거래 불가</div>") +
      (it.tr ? "<div class=\"small muted\">상인 " + won(it.tr[1]) + "</div>" : "") +
      (it.wiki ? "<a class=\"small\" href=\"" + esc(it.wiki) + "\" target=\"_blank\" rel=\"noopener\">위키</a>" : "") + "</div></label>";
  }
  function sortKeys(keys) {
    var s = document.getElementById("sort").value;
    return keys.slice().sort(function (a, b) {
      var ia = I[a.id] || {}, ib = I[b.id] || {};
      if (s === "quest" && (b.q.length > 0) !== (a.q.length > 0)) return (b.q.length > 0) - (a.q.length > 0);
      if (s === "locks" && b.locks !== a.locks) return b.locks - a.locks;
      if (s === "name") return String(ia.n).localeCompare(String(ib.n), "ko");
      return (price(ib) || 0) - (price(ia) || 0);
    });
  }
  function render() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var onlyQuest = document.getElementById("onlyQuest").checked;
    var hideOwned = document.getElementById("hideOwned").checked;
    var html = "";
    D.maps.forEach(function (m) {
      if (cur !== "all" && cur !== m.id) return;
      var keys = m.keys.filter(function (k) {
        var it = I[k.id]; if (!it) return false;
        if (onlyQuest && !k.q.length) return false;
        if (hideOwned && have[k.id]) return false;
        if (q && (it.n + " " + it.en + " " + it.s).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      if (!keys.length && !m.access.length) return;
      var owned = m.keys.filter(function (k) { return have[k.id]; }).length;
      html += "<section class=\"mapsec\"><h2>" + esc(m.n) + " <span class=\"small muted\">열쇠 " + m.keys.length + "개 · 보유 " + owned + "</span></h2>";
      if (m.access.length) {
        html += "<p class=\"access\"><span class=\"badge b-fir\">입장 필요</span> " + m.access.map(function (a) { return esc((I[a] || {}).n || a); }).join(" / ") + "</p>";
      }
      html += "<div class=\"box\" style=\"padding:0\">" + (keys.length ? sortKeys(keys).map(row).join("") : "<div class=\"empty\">조건에 맞는 열쇠가 없습니다</div>") + "</div></section>";
    });
    document.getElementById("list").innerHTML = html || "<div class=\"empty\">조건에 맞는 열쇠가 없습니다</div>";
  }
  document.getElementById("list").addEventListener("change", function (e) {
    var r = e.target.closest(".krow"); if (!r) return;
    var id = r.getAttribute("data-id");
    if (e.target.checked) have[id] = 1; else delete have[id];
    save(KEY, have); render();
  });
  mapsEl.addEventListener("click", function (e) { var v = e.target.getAttribute("data-v"); if (!v) return; cur = v; history.replaceState(null, "", v === "all" ? location.pathname : "#" + v); setSeg("maps", v); render(); });
  ["q", "onlyQuest", "hideOwned", "sort"].forEach(function (id) { document.getElementById(id).addEventListener(id === "q" ? "input" : "change", render); });
  document.getElementById("mode").addEventListener("click", function (e) { var v = e.target.getAttribute("data-v"); if (!v) return; mode = v; save(MODEKEY, v); setSeg("mode", v); render(); });
  render();
})();
</script>
