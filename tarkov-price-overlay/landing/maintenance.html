<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>잠시 점검 중입니다 — 아쿠아파도</title>
<!--
  공통 점검 페이지 (aquapado 전 사이트).
  · Cloudflare 커스텀 오류 페이지(5xx·1xxx)로도 쓰인다 → 아래 ::CLOUDFLARE_ERROR_*_BOX:: 토큰은 지우지 말 것(없으면 등록 거부).
  · 외부 리소스 없음(사이트가 죽어 있을 때 보이는 페이지라 전부 인라인).
  · 사이트 이름은 접속 호스트로 자동 표시. 60초마다 자동 재시도.
-->
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e7eaf0;--sub:#9aa3b2;--cyan:#00f2ea;--warn:#d9822b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI","맑은 고딕",system-ui,sans-serif;line-height:1.6}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .wave{font-size:54px;line-height:1;margin-bottom:10px;animation:bob 2.6s ease-in-out infinite;display:inline-block}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  h1{font-size:24px;margin:6px 0 4px;letter-spacing:-.01em}
  .site{color:var(--cyan);font-weight:700}
  p{margin:8px 0;color:var(--sub);font-size:15px}
  .eta{margin-top:14px;padding:12px 14px;background:#0b0d11;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--fg)}
  .eta b{color:var(--cyan)}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  a.btn,button.btn{display:inline-flex;align-items:center;gap:6px;background:var(--cyan);color:#06211f;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;border:none;cursor:pointer;font-family:inherit}
  a.btn.ghost,button.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .tech{margin-top:22px;border-top:1px dashed var(--line);padding-top:12px;font-size:12px;color:#6b7482;text-align:left}
  .tech summary{cursor:pointer;text-align:center;color:#6b7482}
  .tech .box{margin-top:8px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9aa3b2;word-break:break-all}
  .foot{margin-top:16px;font-size:12px;color:#6b7482}
  .foot a{color:#9aa3b2}
</style>
<!--ga4--><script async src="https://www.googletagmanager.com/gtag/js?id=G-DJMB7WHJZ9"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-DJMB7WHJZ9');</script><!--/ga4-->
</head>
<body>
<div class="wrap"><div class="card">
  <div class="wave" aria-hidden="true">🌊</div>
  <h1>잠시 점검 중입니다</h1>
  <p><span class="site" id="site">아쿠아파도</span>에 일시적인 문제가 있어 바로잡고 있습니다.<br>데이터는 안전하며, 대개 몇 분 안에 정상으로 돌아옵니다.</p>
  <div class="eta"><b id="count">60</b>초 뒤 자동으로 다시 시도합니다 · <span id="time"></span></div>
  <div class="btns">
    <button class="btn" onclick="location.reload()">지금 다시 시도</button>
    <a class="btn ghost" href="https://aquapado.com/" rel="noopener">다른 사이트 보기</a>
  </div>
  <details class="tech">
    <summary>기술 정보</summary>
    <div class="box" id="tech">::CLOUDFLARE_ERROR_500S_BOX::</div>
    <div class="box">::CLOUDFLARE_ERROR_1000S_BOX::</div>
  </details>
  <div class="foot">운영자 pado · <a href="https://aquapado.com/privacy/" rel="noopener">개인정보처리방침</a></div>
</div></div>
<script>
(function(){
  var names={"tarkov.aquapado.com":"타르코프 시세 오버레이 · 탈콥 가이드","tools.aquapado.com":"뚝딱툴즈","poe.aquapado.com":"PoE 3.29 Tools",
    "alpha-ants.aquapado.com":"알파 개미의 포트폴리오","aquapado.com":"아쿠아파도","www.aquapado.com":"아쿠아파도","api.aquapado.com":"아쿠아파도 API","console.aquapado.com":"아쿠아파도 콘솔"};
  var h=location.hostname; var el=document.getElementById("site"); if(names[h]) el.textContent=names[h];
  document.getElementById("time").textContent=new Date().toLocaleTimeString("ko-KR");
  var n=60, c=document.getElementById("count");
  setInterval(function(){ n--; if(n<=0){ location.reload(); return; } c.textContent=n; },1000);
  // Cloudflare 토큰이 치환되지 않은 채(= 우리 서버가 직접 낸 점검 페이지) 보이면 숨긴다
  var t=document.getElementById("tech"); if(t && t.textContent.indexOf("::CLOUDFLARE")===0){ t.parentNode.style.display="none"; }
})();
</script>
</body>
</html>
