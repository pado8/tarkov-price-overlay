[package]
name = "tarkov-price-overlay"
version = "1.3.7"
description = "Tarkov in-game item price overlay"
authors = ["pado8"]
edition = "2021"

[lib]
name = "tarkov_price_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# 11-19 받아 둔 업데이트 파일을 디스크에 두고 설치 직전 서명을 다시 검증(update_cache.rs) — 업데이터 플러그인과 같은 판
minisign-verify = "0.2"
base64 = "0.22"
# 11-20 공식 빌드 확인 표식(build_proof.rs, HMAC-SHA256) — 이미 트리에 있는 판
sha2 = "0.10"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
device_query = "2"

# 1.2.7 포터블→설치판: 설치판 위치(제거 정보 InstallLocation)를 UTF-16 그대로 읽기. 이미 트리에 있는 버전이라 새로 받는 크레이트 없음
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_SystemInformation"] }

# 11-22 앱 본체 충돌(0xc000001d·0xc0000374, 피드백 63·64) — tauri#15408: tao 가 윈도우 이벤트 루프 실행기를 원자적이지 않은 Rc 로
# 들고 있어 여러 스레드가 AppHandle·창을 동시에 복제하면 개수가 깨져 죽는다. upstream 수정이 없어(tao#1290 닫힘) 같은 판(0.35.2)
# 사본에서 Rc → Arc 만 바꿔 쓴다(vendor/tao-0.35.2, 바꾼 곳은 'tarkov-price-overlay 패치' 주석). tauri 를 올릴 때 이 사본도 같은 판으로 다시 만들 것.
[patch.crates-io]
tao = { path = "vendor/tao-0.35.2" }
